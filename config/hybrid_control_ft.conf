# Loaded at startup; edit and restart the executable, no rebuild needed.
# XYZ base-frame vectors. Gains are diagonal; 1 selects velocity, 0 force.
motion_axes = [1, 0, 0];
velocity_kp = [50.0, 0.0, 0.0];
velocity_kd = [0.0, 0.0, 0.0];
force_kp = [0.0, 0.0, 0.25];
force_ki = [0.0, 0.0, 0.10];
force_feedforward_gain = 1.0;
force_integral_limit = 25.0; # N*s per axis, strictly positive

# Robot-on-environment force, N. Feedback limits do NOT limit physical force.
desired_force = [0.0, 0.0, -10.0];
force_feedback_limit = [5.0, 5.0, 20.0];
velocity_axis = 0; # 0=x, 1=y, 2=z
velocity_peak = 0.05; # m/s (10 cm/s peak)
velocity_period = 6.0; # seconds

# Joint order 1..7, radians. Four-DOF robots use the first four entries.
target_position = [0.0, 1.17, 0.0, 2.019, 0.0, 0.0, 0.0];
# Default: use gains from active Barrett robot configuration.
# Set false to use the following overrides for held joints only.
use_robot_hold_gains = true;
hold_kp = [750.0, 1000.0, 400.0, 200.0, 10.0, 10.0, 2.5];
hold_kd = [8.3, 8.0, 3.3, 0.8, 0.5, 0.5, 0.05];

log_period_multiplier = 1;
log_directory = "../data"; # relative to process working directory
