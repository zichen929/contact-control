# Loaded at startup; edit and restart the executable, no rebuild needed.
# XYZ base-frame vectors. Gains are diagonal; 1 selects position, 0 force.
motion_axes = [1, 0, 0];
position_kp = [2000.0, 0.0, 0.0]; # N/m; increased from 125 for position tracking
position_kd = [20.0, 0.0, 0.0]; # N*s/m; velocity-error damping
force_kp = [0.0, 0.0, 0.20];
force_ki = [0.0, 0.0, 0.125];
force_feedforward_gain = 1.0;
force_integral_limit = 25.0; # N*s per axis, strictly positive

# Robot-on-environment force, N. Feedback limits do NOT limit physical force.
desired_force = [0.0, 0.0, -10.0];
force_filter_cutoff_hz = 20.0; # first-order force low-pass; 0 disables
force_feedback_limit = [5.0, 5.0, 20.0];

# "move": one-way move then hold; "sine": oscillate around the captured target x.
position_pattern = "move";
# sine hyperparameters:
position_amplitude = 0.20; # sine only: +/-5 cm (10 cm peak-to-peak)
position_period = 24.0; # sine only: seconds per cycle
# move hyperparameters:
position_distance = 0.3; # meters along base +x from the captured target pose
position_duration = 36.0; # seconds; move duration, or smooth sine startup ramp

# Joint order 1..7, radians. Four-DOF robots use the first four entries.
# Perpendicular target:
target_position = [0.0, 1.164, 0.0, 2.026, 0.0, 0.0, 0.0];
# target_position = [0.0, 1.305, 0.0, 1.4, 0.0, 0.0, 0.0];
# Default: use gains from active Barrett robot configuration.
# Set false to use the following overrides for held joints only.
use_robot_hold_gains = true;
hold_kp = [750.0, 1000.0, 400.0, 200.0, 10.0, 10.0, 2.5];
hold_kd = [8.3, 8.0, 3.3, 0.8, 0.5, 0.5, 0.05];

log_period_multiplier = 1;
log_directory = "../data"; # relative to process working directory
